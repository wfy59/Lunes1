name: Lunes Host 自动保活

on:
  schedule:
    # 每10天运行：1号、11号、21号 中午12:12 (北京时间)
    # UTC 时间 = 北京时间 - 8小时 = 04:12
    - cron: '12 4 1,11,21 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: 执行保活
    runs-on: ubuntu-latest
    permissions:
      contents: write # 由 read 改为 write：用于把运行时间记录提交回 README.md
      actions: write
    concurrency:
      group: lunes-keepalive
      cancel-in-progress: false

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0

      - name: ⚙ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 执行保活
        env:
          LUNES: ${{ secrets.LUNES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/Lunes-Keep.py

      - name: 📝 更新最近运行时间到 README.md
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          # 当前运行时间（北京时间）
          RUN_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          if [ "$RUN_STATUS" = "success" ]; then
            ENTRY="- 🕒 ${RUN_TIME}（北京时间）✅ 保活成功"
          else
            ENTRY="- 🕒 ${RUN_TIME}（北京时间）❌ 运行${RUN_STATUS}"
          fi

          if [ ! -f README.md ]; then
            # README.md 不存在：自动创建并写入最近运行时间区块
            {
              echo "# Lunes Host 自动保活"
              echo ""
              echo "## 🕒 最近运行时间"
              echo ""
              echo "<!-- RUN_LOG_START -->"
              echo "${ENTRY}"
              echo "<!-- RUN_LOG_END -->"
            } > README.md
          elif grep -q '<!-- RUN_LOG_START -->' README.md; then
            # 已有标记：把上一次的时间替换为本次（只保留最新一条）
            awk -v entry="${ENTRY}" '
              /<!-- RUN_LOG_END -->/ {inblock=0}
              !inblock {print}
              /<!-- RUN_LOG_START -->/ {inblock=1; print entry}
            ' README.md > README.tmp && mv README.tmp README.md
          else
            # 无标记：在文件末尾追加最近运行时间区块（不影响已有内容）
            {
              echo ""
              echo "## 🕒 最近运行时间"
              echo ""
              echo "<!-- RUN_LOG_START -->"
              echo "${ENTRY}"
              echo "<!-- RUN_LOG_END -->"
            } >> README.md
          fi

          # 提交并推送（GITHUB_TOKEN 的 push 不会触发其他 workflow，无循环风险）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README.md 无变化，跳过提交"
          else
            git commit -m "chore: 更新最近运行时间 ${RUN_TIME} [skip ci]"
            git push
          fi

#      - name: 上传截图
#        uses: actions/upload-artifact@v4
#        if: always()
#        with:
#          name: screenshots-${{ github.run_number }}
#          path: output/screenshots/
#          retention-days: 3

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
